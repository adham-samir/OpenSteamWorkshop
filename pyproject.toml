[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opensteamworkshop"
version = "0.2.0"
description = "A desktop GUI for browsing and downloading Steam Workshop content"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "doma" }]
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff"]

[project.scripts]
osw = "osw.cli:main"
osw-gui = "osw.gui.main_window:run"

[tool.setuptools.packages.find]
include = ["osw*"]

[tool.setuptools.package-data]
"osw.gui" = ["icons/*.svg"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
