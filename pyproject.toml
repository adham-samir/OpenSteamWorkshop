[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opensteamworkshop"
version = "0.1.0"
description = "A desktop GUI for browsing and downloading Steam Workshop content"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "doma" }]
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
osw = "osw.cli:main"
osw-gui = "osw.gui.main_window:run"

[tool.setuptools.packages.find]
include = ["osw*"]
