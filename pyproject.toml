[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openworkshop"
dynamic = ["version"]
description = "Steam Workshop mod manager for Linux and Windows"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "doma" }]
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff"]

[project.urls]
Homepage = "https://github.com/adham-samir/openworkshop"
Issues = "https://github.com/adham-samir/openworkshop/issues"

[project.scripts]
openworkshop = "osw.cli:main"
openworkshop-gui = "osw.gui.main_window:run"
osw = "osw.cli:main"
osw-gui = "osw.gui.main_window:run"

[tool.setuptools.packages.find]
include = ["osw*"]

[tool.setuptools.dynamic]
version = { attr = "osw.__version__" }

[tool.setuptools.package-data]
"osw.gui" = ["icons/*.svg"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
